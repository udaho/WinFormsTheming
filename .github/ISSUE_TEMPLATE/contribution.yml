name: Issue or proposal
description: Report a bug, request a feature, or propose another contribution.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue or proposed change and relevant reproduction steps.
    validations:
      required: true
  - type: textarea
    id: ai-assistance
    attributes:
      label: Generative AI assistance disclosure
      description: >-
        State "AI assistance: None", or give Provider, Tool/product, and
        Model/version for each provider/model used. These three fields are sufficient.
        See CONTRIBUTING.md.
      placeholder: |
        AI assistance disclosure:
        Provider: OpenAI
        Tool/product: Codex
        Model/version: GPT-6.1 Sol
    validations:
      required: true
